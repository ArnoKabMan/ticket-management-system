services:
  db:
    container_name: incident-postgres
    image: postgres:latest
    environment:
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_pass
      POSTGRES_DB: incident_db
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_user -d incident_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: spring-boot-app
    build:
      context: ../backend/incident-service
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/incident_db
      SPRING_DATASOURCE_USERNAME: incident_user
      SPRING_DATASOURCE_PASSWORD: incident_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db: